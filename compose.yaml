services:
  api:
    image: ustindev/task-api:1.1
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: tasks
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your shell}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in your shell}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:



